<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beanstalk Storybook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ec; --card: #fffdf8; --ink: #1f2a1c; --muted: #6a7363; --line: #e3dccb;
    --accent: #3f8a3a; --accent-ink: #fff; --accent-soft: #e6f1e3; --warn: #a15c00; --warn-soft: #fbefdc;
    --err: #b3261e; --err-soft: #fbe5e3; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121711; --card: #1b2219; --ink: #e8eee0; --muted: #a0aa96; --line: #2f3a2c;
      --accent: #73c266; --accent-ink: #0e150c; --accent-soft: #23331f; --warn: #f0b35e; --warn-soft: #3a2d17;
      --err: #ff8a80; --err-soft: #3b1f1d; --shadow: none; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  h1, h2, h3, .brand { font-family: Fredoka, system-ui, sans-serif; font-weight: 600; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; line-height: 1.2; }
  h2 { font-size: 1.2rem; margin: 0 0 12px; }
  h3 { font-size: 1rem; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }

  header.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .brand { font-size: 1.25rem; text-decoration: none; color: var(--ink); margin-right: auto; display: flex; align-items: center; gap: 8px; }
  nav.tabs { display: flex; gap: 4px; }
  nav.tabs a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: .95rem; }
  nav.tabs a.on { background: var(--accent-soft); color: var(--accent); }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: .9rem; text-decoration: none; color: var(--ink); }
  .who { display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--muted); }

  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 72px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .row { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }

  button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); cursor: pointer; text-decoration: none; }
  button:disabled, .btn.off { opacity: .45; cursor: not-allowed; pointer-events: none; }
  .ghost { background: transparent; color: var(--accent); border-color: var(--accent); }
  .quiet { background: transparent; color: var(--muted); border-color: var(--line); }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-weight: 400; }
  .danger { color: var(--err); }

  label.field { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  input[type=text], input[type=email], input[type=tel], textarea, select { font: inherit; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
  textarea { resize: vertical; min-height: 70px; }
  .fielderr { color: var(--err); font-size: .85rem; min-height: 1.1em; }
  .bad input, .bad textarea, .bad select { border-color: var(--err); }
  .notice { padding: 10px 14px; border-radius: 10px; font-size: .92rem; }
  .notice.err { background: var(--err-soft); color: var(--err); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.ok { background: var(--accent-soft); color: var(--accent); }

  /* Library */
  .bookcard { display: block; text-decoration: none; color: inherit; overflow: hidden; padding: 0; }
  .bookcard .cover { aspect-ratio: 810 / 630; background: var(--bg) center / cover no-repeat; border-bottom: 1px solid var(--line); }
  .bookcard .meta { padding: 12px 14px; }
  .newcard { display: grid; place-items: center; text-align: center; min-height: 230px; border-style: dashed; color: var(--accent); font-weight: 600; text-decoration: none; }

  /* New book */
  .stories { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .story { text-align: left; background: var(--bg); color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 0; overflow: hidden; display: block; font-weight: 400; }
  .story.on { border-color: var(--accent); }
  .story .pic { aspect-ratio: 3 / 2; background: var(--line) center / cover no-repeat; }
  .story .t { padding: 10px 12px; font-family: Fredoka, sans-serif; font-weight: 600; }
  .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 18px; text-align: center; cursor: pointer; color: var(--muted); display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .drop:hover { border-color: var(--accent); }
  .drop .ph { width: 96px; height: 96px; border-radius: 12px; background: var(--line) center / cover no-repeat; }

  /* Book */
  .stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 8px; }
  .stage { font-size: .82rem; color: var(--muted); border-top: 4px solid var(--line); padding-top: 6px; }
  .stage.on { color: var(--ink); border-color: var(--accent); font-weight: 600; }
  .stage.done { border-color: var(--accent); }
  .bar { height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s ease; }
  .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .tile { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); color: var(--ink); aspect-ratio: 810 / 630; font-weight: 400; display: block; width: 100%; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .num { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: .72rem; border-radius: 6px; padding: 1px 6px; }
  .tile .tries { position: absolute; right: 6px; top: 6px; font-size: .72rem; border-radius: 6px; padding: 1px 6px; background: rgba(255,255,255,.92); color: #1f2a1c; font-weight: 600; }
  .tile .tries.retry { background: #fbefdc; color: #8a4d00; }
  .tile .tries.best { background: #fbe5e3; color: #9b2119; }
  .tile .state { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: .8rem; color: var(--muted); padding: 8px; }
  .tile.busy .state::before { content: ""; width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; display: block; margin: 0 auto 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Page viewer: the same layout rules as the PDF */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(980px, 96vw); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .viewer { padding: 16px; }
  .page { position: relative; aspect-ratio: 810 / 630; border-radius: 8px; overflow: hidden; background: #fbf6e9; container-type: inline-size; }
  .page img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .page .words { position: absolute; left: 0; right: 0; display: grid; place-items: center; text-align: center; padding: 0 8%; color: #fff; font-family: Fredoka, sans-serif; font-weight: 600; line-height: 1.28; text-shadow: 0 2px 3px rgba(0,0,0,.45); }
  .page .words.top { background: linear-gradient(rgba(0,0,0,.6), transparent); }
  .page .words.bottom { background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .page .words.middle span { background: rgba(0,0,0,.5); border-radius: 12px; padding: 6px 14px; }
  .page.panel img { height: var(--art, 72%); }
  .page.panel .words { top: auto; bottom: 7%; color: #23311f; text-shadow: none; }

  table { width: 100%; border-collapse: collapse; font-size: .93rem; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: .82rem; }
  td.amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plus { color: var(--accent); }
  .big { font-family: Fredoka, sans-serif; font-size: 2.4rem; font-weight: 600; line-height: 1.1; }
  .steps { display: grid; gap: 16px; }
  .step-h { display: flex; gap: 10px; align-items: center; }
  .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-weight: 700; font-size: .9rem; flex: none; }
  .dot.done { background: var(--accent); color: var(--accent-ink); }
  footer { max-width: 1120px; margin: 0 auto; padding: 0 16px 32px; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--muted); }
  @media (max-width: 640px) { .stages { grid-template-columns: repeat(2, 1fr); } .who .email { display: none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#books">📖 Beanstalk Storybook</a>
    <nav class="tabs" id="tabs" hidden>
      <a href="#books" data-tab="books">My books</a>
      <a href="#new" data-tab="new">New book</a>
      <a href="#wallet" data-tab="wallet">Wallet</a>
    </nav>
    <a class="chip" id="balance" href="#wallet" hidden></a>
    <div class="who" id="who" hidden><span class="email" id="email"></span><button class="link" id="logout">Sign out</button></div>
  </div>
</header>
<main id="view" aria-live="polite"></main>
<footer>Test mode: payments use Stripe's test sandbox and print orders go to Lulu's sandbox, so no real money moves and nothing is printed. · <a href="/privacy.html">Privacy</a></footer>
<dialog id="viewer"></dialog>
<script src="/app.js"></script>
</body>
</html>
