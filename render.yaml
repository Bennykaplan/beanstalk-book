services:
  - type: web
    name: beanstalk-book
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set the value in the Render dashboard, never in the repo
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-image
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
