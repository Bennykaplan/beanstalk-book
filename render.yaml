services:
  - type: web
    name: beanstalk-book
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false # set the value in the Render dashboard, never in the repo
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1.5
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
